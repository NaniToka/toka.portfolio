name: Generate Snake

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: NaniToka
          outputs: |
            dist/github-snake-dark.svg?color_snake=#00E5FF&color_dots=#161b22,#3B0A6B,#5E17A8,#00B8D4,#00E5FF
            dist/github-snake.svg?color_snake=#3B0A6B&color_dots=#ebedf0,#c9b3e6,#9b6fd1,#6a2db0,#3B0A6B

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
